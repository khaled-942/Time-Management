<div class="admin-container">
  <div class="header-section">
    <h1 class="text-3xl font-semibold text-900">Admin Dashboard</h1>
  </div>

  <div class="admin-content">
    <p-tabView>
      <!-- Holidays Management Tab -->
      <p-tabPanel header="Holidays Management">
        <p-card>
          <div class="form-grid">
            <div class="form-group">
              <label for="holidayDate" class="form-label">Date</label>
              <p-calendar [(ngModel)]="newHoliday.date" [showIcon]="true" inputId="holidayDate" styleClass="w-full">
              </p-calendar>
            </div>

            <div class="form-group">
              <label for="holidayName" class="form-label">Holiday Name</label>
              <input pInputText id="holidayName" [(ngModel)]="newHoliday.name" placeholder="Enter holiday name"
                class="w-full" />
            </div>

            <div class="form-group">
              <label for="holidayTags" class="form-label">Tags</label>
              <p-dropdown [options]="holidayTags" [(ngModel)]="selectedTags" multiple optionLabel="name"
                optionValue="value" placeholder="Select Tags" styleClass="w-full">
              </p-dropdown>
            </div>

            <div class="form-actions">
              <p-button label="Add Holiday" (onClick)="addHoliday()" icon="pi pi-plus" styleClass="p-button-primary">
              </p-button>
            </div>
          </div>

          <div class="table-container">
            <p-table [value]="holidays" [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
              currentPageReportTemplate="Showing {first} to {last} of {totalRecords} holidays"
              styleClass="p-datatable-gridlines">
              <ng-template pTemplate="header">
                <tr>
                  <th class="text-left">Date</th>
                  <th class="text-left">Name</th>
                  <th class="text-left">Tags</th>
                  <th class="text-center">Actions</th>
                </tr>
              </ng-template>
              <ng-template pTemplate="body" let-holiday>
                <tr>
                  <td>{{ holiday.date | date : "mediumDate" }}</td>
                  <td>{{ holiday.name }}</td>
                  <td>
                    <div class="tag-list">

                      <span class="tag-badge">{{holiday.tags}}</span>

                    </div>
                  </td>
                  <td class="text-center">
                    <p-button icon="pi pi-trash" styleClass="p-button-danger p-button-text"
                      (onClick)="deleteHoliday(holiday)">
                    </p-button>
                  </td>
                </tr>
              </ng-template>
            </p-table>
          </div>
        </p-card>
      </p-tabPanel>

      <!-- User Management Tab -->
      <p-tabPanel header="User Management">
        <p-card>
          <div class="table-container">
            <p-table [value]="users" [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
              currentPageReportTemplate="Showing {first} to {last} of {totalRecords} users"
              styleClass="p-datatable-gridlines">
              <ng-template pTemplate="header">
                <tr>
                  <th class="text-center w-4rem">Verified</th>
                  <th class="text-left">Name</th>
                  <th class="text-left">Email</th>
                  <th class="text-left">Phone</th>
                  <th class="text-center">Actions</th>
                </tr>
              </ng-template>
              <ng-template pTemplate="body" let-user>
                <tr>
                  <td class="text-center">
                    <p-checkbox [binary]="true" [(ngModel)]="user.verified" [styleClass]="'verification-checkbox'">
                    </p-checkbox>
                  </td>
                  <td>{{ user.name }}</td>
                  <td>{{ user.email }}</td>
                  <td>{{ user.phone }}</td>
                  <td class="text-center">
                    <p-button icon="pi pi-download" label="Export" styleClass="p-button-outlined p-button-primary"
                      (onClick)="downloadUserData(user)">
                    </p-button>
                  </td>
                </tr>
              </ng-template>
            </p-table>
          </div>
        </p-card>
      </p-tabPanel>
    </p-tabView>
  </div>
</div>
