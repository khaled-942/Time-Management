<aside class="sidebar">
  <a class="brand" routerLink="/dashboard" (click)="navigate.emit()">
    <span class="brand-mark"><i class="pi pi-stopwatch"></i></span>
    <span class="brand-text">
      <small>Attendance</small>
      <strong>Time I/O</strong>
    </span>
  </a>

  <nav class="sidebar-nav" aria-label="Main">
    @for (section of sections; track section.title) {
    @if (!section.adminOnly || isAdmin) {
    <div class="nav-section">
      <span class="nav-section-title">{{ section.title }}</span>
      @for (item of section.items; track item.route) {
      <a class="nav-item" [routerLink]="item.route" routerLinkActive="active" (click)="navigate.emit()">
        <i [class]="item.icon"></i>
        <span>{{ item.label }}</span>
      </a>
      }
    </div>
    }
    }
  </nav>

  <button type="button" class="user-card" (click)="menu.toggle($event)" aria-haspopup="true">
    <img class="user-avatar" [src]="user?.currentAvatar" [alt]="user?.name || 'Avatar'" />
    <span class="user-text">
      <strong>{{ user?.name }}</strong>
      <small>{{ isAdmin ? 'Administrator' : (user?.position || 'Employee') }}</small>
    </span>
    <i class="pi pi-chevron-up"></i>
  </button>
  <p-menu #menu [model]="accountMenu" [popup]="true" appendTo="body"></p-menu>
</aside>
