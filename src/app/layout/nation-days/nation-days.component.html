<div class="national-days-container">
  <!-- Header Card -->
  <div class="header-card">
    <p-card styleClass="shadow-2 border-round-xl">
      <ng-template pTemplate="header">
        <div class="card-header">
          <h1 class="text-3xl font-semibold text-900">National Days of Egypt</h1>
          <p class="text-color-secondary mt-2">
            A comprehensive list of national, religious, and cultural days that reflect Egypt's rich historical
            heritage.
          </p>
        </div>
      </ng-template>
    </p-card>
  </div>

  <!-- Calendar Table -->
  <div class="calendar-card">
    <p-card styleClass="shadow-2 border-round-xl">
      @if(!loading) {
      <p-table [value]="nationalDays" [tableStyle]="{'min-width': '50rem'}" [sortField]="'date'" [paginator]="true"
        [rows]="10" [showCurrentPageReport]="true"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} days" styleClass="p-datatable-gridlines">
        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="date" class="text-left">
              Date
              <p-sortIcon field="date"></p-sortIcon>
            </th>
            <th pSortableColumn="name" class="text-left">
              Name
              <p-sortIcon field="name"></p-sortIcon>
            </th>
            <th pSortableColumn="type" class="text-left">
              Type
              <p-sortIcon field="type"></p-sortIcon>
            </th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-day>
          <tr>
            <td>{{ day.date | date: 'EEE dd MMM yyyy'}}</td>
            <td>{{ day.name }}</td>
            <td>
              <span [ngClass]="getTypeClass(day.type)" class="type-badge">
                {{ day.type }}
              </span>
            </td>
          </tr>
        </ng-template>
      </p-table>
      }
    </p-card>
  </div>
</div>
