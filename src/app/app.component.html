@if (isLoading) {
<div class="route-progress"><span></span></div>
}
@if (isLoggedIn) {
<div class="shell" [class.sidebar-open]="sidebarOpen">
  <app-side-bar (navigate)="sidebarOpen = false"></app-side-bar>
  <div class="sidebar-backdrop" (click)="sidebarOpen = false"></div>

  <div class="shell-main">
    <appNavbar (menuToggle)="sidebarOpen = !sidebarOpen"></appNavbar>
    <main class="shell-content">
      <router-outlet />
    </main>
  </div>
</div>
} @else {
<router-outlet />
}
