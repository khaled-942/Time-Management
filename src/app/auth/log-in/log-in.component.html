<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-mark"><i class="pi pi-stopwatch"></i></span>
      <span class="eyebrow">Time I/O</span>
    </div>
    <h1>Sign in</h1>
    <p class="muted">Track your attendance and pay.</p>

    <form [formGroup]="loginForm" (ngSubmit)="handleSubmit()" class="auth-form">
      <label class="auth-field" for="username">
        <span>Email</span>
        <input id="username" pInputText type="email" formControlName="username" placeholder="you@company.com"
          autocomplete="email" [class.p-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" />
      </label>

      <label class="auth-field" for="password">
        <span>Password</span>
        <input id="password" pInputText type="password" formControlName="password" placeholder="••••••••"
          autocomplete="current-password"
          [class.p-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" />
      </label>

      @if (error) {
      <div class="callout danger" role="alert">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ error }}</span>
      </div>
      }

      <button pButton type="submit" class="auth-submit" [disabled]="!isFormValid() || isLoading">
        @if (isLoading) {
        <i class="pi pi-spin pi-spinner"></i>
        } @else {
        <i class="pi pi-sign-in"></i>
        }
        <span>{{ isLoading ? 'Signing in…' : 'Sign in' }}</span>
      </button>
    </form>

    <p class="auth-switch">
      Don't have an account? <a [routerLink]="['/register']">Create one</a>
    </p>
  </div>
</div>
