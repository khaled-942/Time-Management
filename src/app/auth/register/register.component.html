<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-mark"><i class="pi pi-stopwatch"></i></span>
      <span class="eyebrow">Time I/O</span>
    </div>
    <h1>Create an account</h1>
    <p class="muted">Takes less than a minute.</p>

    <form [formGroup]="registerForm" (ngSubmit)="handleRegister()" class="auth-form">
      <label class="auth-field" for="username">
        <span>Full name</span>
        <input id="username" pInputText type="text" formControlName="username" placeholder="Your name" autocomplete="name"
          [class.p-invalid]="registerForm.get('username')?.invalid && registerForm.get('username')?.touched" />
        @if (registerForm.get('username')?.invalid && registerForm.get('username')?.touched) {
        <small class="field-error">At least 3 characters.</small>
        }
      </label>

      <label class="auth-field" for="email">
        <span>Email</span>
        <input id="email" pInputText type="email" formControlName="email" placeholder="you@company.com"
          autocomplete="email" [class.p-invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" />
        @if (registerForm.get('email')?.invalid && registerForm.get('email')?.touched) {
        <small class="field-error">Please enter a valid email.</small>
        }
      </label>

      <label class="auth-field" for="password">
        <span>Password</span>
        <input id="password" pInputText type="password" formControlName="password" placeholder="At least 6 characters"
          autocomplete="new-password"
          [class.p-invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" />
        @if (registerForm.get('password')?.invalid && registerForm.get('password')?.touched) {
        <small class="field-error">At least 6 characters.</small>
        }
      </label>

      <label class="auth-field" for="confirmPassword">
        <span>Confirm password</span>
        <input id="confirmPassword" pInputText type="password" formControlName="confirmPassword"
          placeholder="Type it again" autocomplete="new-password"
          [class.p-invalid]="registerForm.get('confirmPassword')?.errors?.['passwordMismatch']" />
        @if (registerForm.get('confirmPassword')?.errors?.['passwordMismatch']) {
        <small class="field-error">Passwords do not match.</small>
        }
      </label>

      @if (error) {
      <div class="callout danger" role="alert">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ error }}</span>
      </div>
      }

      <button pButton type="submit" class="auth-submit" [disabled]="!isFormValid() || isLoading">
        @if (isLoading) {
        <i class="pi pi-spin pi-spinner"></i>
        } @else {
        <i class="pi pi-user-plus"></i>
        }
        <span>{{ isLoading ? 'Creating account…' : 'Create account' }}</span>
      </button>
    </form>

    <p class="auth-switch">
      Already have an account? <a [routerLink]="['/login']">Sign in</a>
    </p>
  </div>
</div>
